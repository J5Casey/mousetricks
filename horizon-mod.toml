id = "mousetricks"
name = "Mouse Tricks"
version = "0.3.0"
description = "Right-drag places one item per slot, left-drag gathers or moves stacks, the wheel moves items one by one, a key or a middle click sorts."
authors = ["d3grando"]
# A native mod on the mod API only (no [native.*] rows, no game internals):
# Rust in src/, compiled by the launcher against the game build [native] pins.
api = "0.2"
side = "client"
capabilities = ["registries"]

[native]
game = "26.3"
