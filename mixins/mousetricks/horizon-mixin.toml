[mod]
id = "mousetricks"
version = "0.3.0"
priority = 100

# Every hook names a native hook point (`hook`, resolved from the source's
# native-hooks.json), so the mod needs no pinned commit: it builds on any
# Horizon whose NATIVE_HOOKS_API has the screen drag and wheel v2 hooks
# (horizon-rust/horizon#12286). Until that API is stamped with a number,
# the commit below is the engine branch it was built and tested on.
[compatibility]
horizon_revision = "957475f6441730bfda7e95ae6c8223a7918f6ea5"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "mousetricks"
source = "runtime.rs"

[[module]]
id = "native"
file = "crates/horizon-client/src/game.rs"
name = "mousetricks_native"
source = "native.rs"

# Hook point (API 114): a window mouse button going down or up, on any
# screen, before the game dispatches it. A left or right press goes on (the
# drag it may start is noted); a middle click on an empty spot sorts and is
# cancelled (the game's own sort button answers "handled" the same way). A
# release ends the drag and goes on.
[[injection]]
id = "button"
hook = "mouse_button_pre"
hook_version = 1
kind = "HEAD"
helper = "button.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "button", ty = "i32", value = "button" },
  { name = "pressed", ty = "bool", value = "pressed" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

# Hook point: a held button moving over a screen, before any screen drag
# handler. A move that belongs to a Mouse Tricks drag clicks the slot it
# entered and is cancelled (the game's quick craft drag then doesn't grow);
# any other goes on.
[[injection]]
id = "drag"
hook = "screen_mouse_dragged_pre_v2"
hook_version = 1
kind = "HEAD"
helper = "drag.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

# Hook point: the wheel over a screen, before anything scrolls. Over a stack
# it works on, Mouse Tricks moves items one by one and cancels the turn; a
# bundle under the cursor keeps its own wheel.
[[injection]]
id = "wheel"
hook = "screen_mouse_scrolled_pre_v2"
hook_version = 1
kind = "HEAD"
helper = "wheel.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "scroll", ty = "[f64; 2]", value = "scroll" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

# Hook point: a drag whose release went to another screen ends; a paced sort
# (on a server) makes its next clicks.
[[injection]]
id = "frame"
kind = "HEAD"
hook = "frame"
hook_version = 1
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "elapsed", ty = "std::time::Duration", value = "elapsed" },
]

# Hook point: the sort key over an inventory screen (keys reach it on any
# screen).
[[injection]]
id = "key"
kind = "HEAD"
hook = "key"
hook_version = 1
helper = "key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

# Hook points: the row in Options > Mods and its settings page.
[[injection]]
id = "list"
kind = "HEAD"
hook = "mods"
hook_version = 1
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
hook = "settings"
hook_version = 1
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
kind = "HEAD"
hook = "settings_click"
hook_version = 1
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]
